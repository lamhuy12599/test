<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f2e7">
<title>Independence Palace AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f2e7; --paper2:#efe7d4; --ink:#1c1a16; --ink2:#5a5448; --red:#b3261e; --green:#2e7d4f;
  --line:rgba(28,26,22,.2);
  --serif:"Playfair Display","Times New Roman",Georgia,serif;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{font-size:16px;line-height:1.6}
body{overflow:hidden;position:fixed;inset:0;width:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}

.cta{display:block;width:100%;min-height:54px;border:2px solid var(--ink);background:var(--red);color:#fff;font:700 17px var(--sans);letter-spacing:.02em;padding:14px 18px;box-shadow:4px 4px 0 var(--ink);transition:transform .15s ease,box-shadow .15s ease}
.cta:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
/* ===== màn hình AR ===== */
#arScreen{position:fixed;inset:0;background:#111;z-index:10;display:none}
#arScreen.on{display:block}
#ar{position:absolute;inset:0;overflow:hidden;touch-action:none;--night:0}
#ar video{filter:brightness(calc(1 - var(--night) * .42)) saturate(calc(1 - var(--night) * .2))}
#hud{position:absolute;inset:0;pointer-events:none}
.pill{pointer-events:auto;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);box-shadow:2px 2px 0 rgba(28,26,22,.35)}
#close{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;min-height:44px;padding:0 16px;border-radius:999px;font:700 14px var(--sans)}
#tag{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;min-height:44px;display:flex;align-items:center;padding:0 14px;border-radius:999px;font:900 15px var(--serif);pointer-events:none}
#tag span{color:var(--red);margin-left:6px;font:700 11px var(--sans);letter-spacing:.14em}
#frame{position:absolute;left:50%;top:40%;width:min(82vw,560px);aspect-ratio:1024/751;transform:translate(-50%,-50%)}
#frame i{position:absolute;width:34px;height:34px;border:0 solid #fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
#frame i:nth-child(1){left:0;top:0;border-left-width:4px;border-top-width:4px;border-top-left-radius:10px}
#frame i:nth-child(2){right:0;top:0;border-right-width:4px;border-top-width:4px;border-top-right-radius:10px}
#frame i:nth-child(3){left:0;bottom:0;border-left-width:4px;border-bottom-width:4px;border-bottom-left-radius:10px}
#frame i:nth-child(4){right:0;bottom:0;border-right-width:4px;border-bottom-width:4px;border-bottom-right-radius:10px}
#frame b{position:absolute;left:6%;right:6%;top:8%;height:2px;background:var(--red);box-shadow:0 0 12px 2px rgba(255,80,60,.65);animation:scan 2.4s ease-in-out infinite alternate}
@keyframes scan{to{top:92%}}
#frameCap{position:absolute;left:50%;top:calc(40% + min(41vw,280px) * .733 + 18px);transform:translateX(-50%);width:max-content;max-width:88vw;padding:8px 14px;border-radius:999px;font:500 13.5px var(--sans);text-align:center}


#sheet{position:absolute;left:0;right:0;bottom:0;width:min(100%,660px);margin:0 auto;background:var(--paper);border-top:3px double var(--ink);border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.22);pointer-events:auto}
#kick{display:flex;align-items:center;gap:8px;font:700 11.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
#kick::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 1.3s ease-in-out infinite}
#kick[data-s="ok"]{color:var(--green)}
#kick[data-s="ok"]::before{background:var(--green);animation:none}
@keyframes pulse{50%{opacity:.25}}
#sh{font-family:var(--serif);font-weight:800;font-size:20px;line-height:1.15;margin:6px 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{min-height:44px;padding:0 15px;border-radius:999px;border:1.5px solid var(--ink);background:#fff;font:500 14px var(--sans);transition:background .2s,color .2s}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

#load,#fail{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(247,242,231,.96)}
.panel{max-width:360px;text-align:center}
.panel h2{font-family:var(--serif);font-size:24px;margin:14px 0 6px}
.panel p{margin:0 0 16px;color:var(--ink2);font-size:15px}
.spin{width:34px;height:34px;margin:0 auto;border-radius:50%;border:3px solid var(--line);border-top-color:var(--red);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.panel .cta{margin-bottom:12px}
.ghost{min-height:44px;padding:0 18px;border:1.5px solid var(--ink);background:#fff;font:500 14px var(--sans);border-radius:999px}
@media (prefers-reduced-motion:reduce){#frame b,.spin,#kick::before{animation-duration:3s}}
</style>

<section id="arScreen" class="on" aria-label="Augmented reality view">
  <div id="ar"></div>
  <div id="hud">
    <button id="close" class="pill" type="button">← Close</button>
    <div id="tag" class="pill">Independence Palace<span>AR</span></div>
    <div id="frame" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>
    <div id="frameCap" class="pill">Fit the whole painting in the frame</div>

    <div id="sheet">
      <div id="kick" data-s="">Searching</div>
      <h2 id="sh">Point the camera at the painting</h2>
      <div class="chips" role="group" aria-label="Model options">
        <button id="gardenBtn" type="button" aria-pressed="false">Full front yard</button>
        <button id="nightBtn" type="button" aria-pressed="false">Night</button>
        <button id="spinBtn" type="button" aria-pressed="false">Auto spin</button>
      </div>
    </div>
  </div>
  <div id="load"><div class="panel"><div class="spin"></div><h2 id="loadT">Getting ready</h2><p id="loadP">Please wait a moment.</p></div></div>
  <div id="fail" hidden><div class="panel"><h2 id="failT">Couldn't start AR</h2><p id="failP"></p><button id="retry" class="cta" type="button">Try again</button></div></div>
</section>


<script type="module">
const $=id=>document.getElementById(id);
const MINDAR_UMD='https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js';
const TARGET_FILE='targets.mind';   // file biên dịch sẵn, đặt cạnh file HTML
const CACHE_KEY='dinh-doc-lap-target-v1';
const THICK=1.65;                       // độ dày đế mô hình (m), để đế tựa đúng lên mặt tranh

/* ================= Mô hình 3D (lấy từ file số 1, chuyển sang three r160) ================= */
function createModel(T,maxAniso){
const PI=Math.PI;
let seed=1966;
const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
const rr=(a,b)=>a+(b-a)*rnd();
const safe=(n,f)=>{try{f();}catch(e){console.error('[build:'+n+']',e);}};
const root=new T.Group(),garden=new T.Group();
/* ============ helpers ============ */
let P=root;
const mats=[];
function mat(hex,o){
  o=Object.assign({},o||{});
  const unit=o.unit;delete o.unit;
  const p=Object.assign({roughness:.9,metalness:0,envMapIntensity:.3},o);
  const m=new T.MeshStandardMaterial(p);
  m.color.setHex(hex);
  m.userData.env=p.envMapIntensity;m.userData.unit=unit;
  mats.push(m);return m;
}
function tex(w,h,draw,o){
  o=o||{};
  const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new T.CanvasTexture(c);
  t.colorSpace=T.SRGBColorSpace;
  t.anisotropy=Math.min(8,maxAniso);
  if(o.rep){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(o.rep[0],o.rep[1]);}
  return t;
}
function scaleUV(geo,su,sv){
  const uv=geo.attributes.uv;
  for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*su,uv.getY(i)*sv);
  uv.needsUpdate=true;return geo;
}
/* hộp theo tâm; nếu vật liệu có "unit" thì UV co theo kích thước thật (m) */
function box(w,h,d,m,x,y,z,parent){
  const g=new T.BoxGeometry(w,h,d);
  const u=m.userData.unit;
  if(u){
    const uv=g.attributes.uv,dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]],ox=rnd(),oy=rnd();
    for(let f=0;f<6;f++)for(let k=0;k<4;k++){const i=f*4+k;uv.setXY(i,uv.getX(i)*dims[f][0]/u+ox,uv.getY(i)*dims[f][1]/u+oy);}
    uv.needsUpdate=true;
  }
  const o=new T.Mesh(g,m);
  o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;
  (parent||P).add(o);return o;
}
const bx=(x0,x1,y0,y1,z0,z1,m)=>box(x1-x0,y1-y0,z1-z0,m,(x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
function flat(w,d,m,x,y,z,su,sv,geo){
  const g=geo||new T.PlaneGeometry(w,d);
  if(su)scaleUV(g,su,sv);
  const o=new T.Mesh(g,m);o.rotation.x=-PI/2;o.position.set(x,y,z);o.receiveShadow=true;
  P.add(o);return o;
}
/* arr item: [x,y,z, sx,sy,sz, ry, colorHex, rz] */
function instanced(geo,m,arr,opts){
  opts=opts||{};
  if(!arr.length)return null;
  const im=new T.InstancedMesh(geo,m,arr.length);
  const d=new T.Object3D(),c=new T.Color();
  arr.forEach((a,i)=>{
    d.position.set(a[0],a[1],a[2]);
    d.rotation.set(0,a[6]||0,a[8]||0,'YXZ');
    d.scale.set(a[3],a[4],a[5]);
    d.updateMatrix();im.setMatrixAt(i,d.matrix);
    if(a[7]!==undefined&&a[7]!==null){c.setHex(a[7]);im.setColorAt(i,c);}
  });
  im.instanceMatrix.needsUpdate=true;
  if(im.instanceColor)im.instanceColor.needsUpdate=true;
  im.frustumCulled=false;
  im.castShadow=opts.cast!==false;im.receiveShadow=opts.recv!==false;
  (opts.parent||P).add(im);return im;
}

/* ============ textures (màu lấy từ ảnh thật) ============ */
const concTex=tex(256,256,(g,w,h)=>{
  g.fillStyle='#fbfaf6';g.fillRect(0,0,w,h);
  for(let i=0;i<2600;i++){const v=170+rnd()*70|0;g.fillStyle='rgba('+v+','+(v-3)+','+(v-10)+','+(.035+rnd()*.06)+')';g.fillRect(rnd()*w,rnd()*h,1+rnd()*2.5,1+rnd()*2.5);}
  for(let j=0;j<26;j++){const x=rnd()*w,len=h*(.25+rnd()*.6);const gr=g.createLinearGradient(0,0,0,len);gr.addColorStop(0,'rgba(100,96,86,.10)');gr.addColorStop(1,'rgba(100,96,86,0)');g.fillStyle=gr;g.fillRect(x,0,1+rnd()*4,len);}
},{rep:[1,1]});
function blockTex(base,spread){
  return tex(256,256,(g,w,h)=>{
    g.fillStyle=base;g.fillRect(0,0,w,h);
    let y=0;
    while(y<h){
      const rh=30+rnd()*30;let x=-rnd()*50;
      while(x<w){
        const bw=45+rnd()*60,v=(rnd()-.5)*spread;
        g.fillStyle=v>0?'rgba(255,255,255,'+(v/255)+')':'rgba(0,0,0,'+(-v/255)+')';
        g.fillRect(x+1,y+1,bw-2,rh-2);
        g.strokeStyle='rgba(38,32,26,.6)';g.lineWidth=2;g.strokeRect(x+1,y+1,bw-2,rh-2);
        x+=bw;
      }
      y+=rh;
    }
    for(let i=0;i<2500;i++){g.fillStyle='rgba(0,0,0,'+(.05+rnd()*.08)+')';g.fillRect(rnd()*w,rnd()*h,1+rnd(),1+rnd());}
  },{rep:[1,1]});
}
const stoneTex=blockTex('#8a8279',70);      // tường ốp đá ở tầng trệt hai chái (xám nâu)
const tanTex=blockTex('#cdb48a',60);        // tường đá chắn trước nền (vàng cát)
const granTex=tex(256,256,(g,w,h)=>{
  g.fillStyle='#d3cfc4';g.fillRect(0,0,w,h);
  for(let a=0;a<2;a++)for(let b=0;b<2;b++){g.fillStyle='rgba('+(rnd()<.5?'255,250,240':'90,85,75')+','+(.03+rnd()*.05)+')';g.fillRect(a*128,b*128,128,128);}
  for(let i=0;i<5000;i++){const v=rnd()<.5?80+rnd()*60:200+rnd()*55;g.fillStyle='rgba('+(v|0)+','+(v|0)+','+((v-6)|0)+','+(.08+rnd()*.14)+')';g.fillRect(rnd()*w,rnd()*h,1+rnd(),1+rnd());}
  g.strokeStyle='rgba(70,66,58,.6)';g.lineWidth=2;g.beginPath();
  g.moveTo(0,0);g.lineTo(w,0);g.moveTo(0,0);g.lineTo(0,h);g.moveTo(w/2,0);g.lineTo(w/2,h);g.moveTo(0,h/2);g.lineTo(w,h/2);g.stroke();
},{rep:[1,1]});
const deckTex=tex(256,256,(g,w,h)=>{       // sàn mái: gạch đá vuông nhiều tông nâu xám (theo ảnh flycam)
  const pal=['#a39280','#b3a086','#9a8d7d','#bba68a','#8f8577','#a99b8a','#c0ad90','#978a78'];
  for(let a=0;a<4;a++)for(let b=0;b<4;b++){g.fillStyle=pal[(rnd()*pal.length)|0];g.fillRect(a*64,b*64,64,64);}
  for(let i=0;i<5000;i++){g.fillStyle=rnd()<.5?'rgba(60,52,44,'+(.06+rnd()*.1)+')':'rgba(255,250,240,'+(.06+rnd()*.1)+')';g.fillRect(rnd()*w,rnd()*h,1+rnd()*1.5,1+rnd()*1.5);}
  g.strokeStyle='rgba(60,52,44,.55)';g.lineWidth=2;g.beginPath();
  for(let k=0;k<=4;k++){g.moveTo(k*64,0);g.lineTo(k*64,h);g.moveTo(0,k*64);g.lineTo(w,k*64);}g.stroke();
},{rep:[1,1]});
const rampTex=tex(256,256,(g,w,h)=>{       // mặt dốc xe: bê tông nâu xám lốm đốm
  g.fillStyle='#bdb3a3';g.fillRect(0,0,w,h);

/* ============ SỐ ĐO CHÍNH (mét), rút từ ảnh thật ============
   Mặt tiền rộng 80,2 m = 9 bay mỗi bên + cụm giữa. Bay rèm hoa đá 3,67 m, bay hai chái 3,9 m.
   Cụm giữa rộng 12,8 m giữa hai cặp trụ đôi (x = ±6,4).
   Từ dưới lên: nền (3,2) | tầng 1 thấp (3,2-6,7) | dải sàn dày (6,7-7,9) | dải cửa gác lửng (8,1-9,3)
   | tầng 2 rèm hoa đá (9,8-16,0) | dải lam ngang (16-17) | cửa tầng 3 (17-18,9) | mái (19,5-20,4)
   | lầu Tứ phương vô sự (20,5-23,8) | cột cờ (đến 28,6). */
const GF=3.2, RFb=19.5, RFt=20.4;
const LBW=3.67, WBW=3.9;
const edges=[6.8];for(let k=1;k<=6;k++)edges.push(6.4+LBW*k);for(let j=1;j<=3;j++)edges.push(28.42+WBW*j);
const concArr=[],frameArr=[],whiteArr=[],railArr=[],latArr=[],potArr=[],topArr=[],palmTr=[],palmFr=[];
const ce=(x,y,z,sx,sy,sz)=>concArr.push([x,y,z,sx,sy,sz]);
const fe=(x,y,z,sx,sy,sz)=>frameArr.push([x,y,z,sx,sy,sz]);

  for(let i=0;i<7;i++)palmFr.push([x,y+1.7,z,k,k,k,i/7*PI*2+rr(-.2,.2),null,rr(.1,.45)]);

function lerpT(tb,a){
  if(a<=tb[0][0])return tb[0][1];
  for(let i=1;i<tb.length;i++)if(a<=tb[i][0]){const t=(a-tb[i-1][0])/(tb[i][0]-tb[i-1][0]);return tb[i-1][1]+(tb[i][1]-tb[i-1][1])*t;}
  return tb[tb.length-1][1];
}
/* dải mặt giữa hai đường gấp khúc A, B (mỗi điểm [x,y,z]) */
function strip(A,B,m,uvs){
  const n=A.length,pos=[],uv=[],idx=[];let ua=0;
  for(let i=0;i<n;i++){
    if(i>0)ua+=Math.hypot(A[i][0]-A[i-1][0],A[i][2]-A[i-1][2]);
    pos.push(A[i][0],A[i][1],A[i][2],B[i][0],B[i][1],B[i][2]);
    const vl=Math.hypot(B[i][0]-A[i][0],B[i][1]-A[i][1],B[i][2]-A[i][2]);
    uv.push(ua/uvs,0,ua/uvs,vl/uvs);
  }
  for(let i=0;i<n-1;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
  const g=new T.BufferGeometry();
  g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setAttribute('uv',new T.Float32BufferAttribute(uv,2));
  g.setIndex(idx);g.computeVertexNormals();
  const o=new T.Mesh(g,m);o.castShadow=true;o.receiveShadow=true;P.add(o);return o;
}
/* khối đa giác (x,z) đùn lên cao h từ y0 */
function prismY(pts,y0,h,m){
  const sh=new T.Shape();pts.forEach((p,i)=>i?sh.lineTo(p[0],-p[1]):sh.moveTo(p[0],-p[1]));
  const g=new T.ExtrudeGeometry(sh,{depth:h,bevelEnabled:false});g.rotateX(-PI/2);
  const o=new T.Mesh(g,m);o.position.y=y0;o.castShadow=true;o.receiveShadow=true;P.add(o);return o;
}
/* mặt phẳng đa giác (x,z) ở độ cao y */
function planeY(pts,y,m,uvs){
  const sh=new T.Shape();pts.forEach((p,i)=>i?sh.lineTo(p[0],-p[1]):sh.moveTo(p[0],-p[1]));
  const g=new T.ShapeGeometry(sh);if(uvs&&uvs!==1)scaleUV(g,uvs,uvs);g.rotateX(-PI/2);
  const o=new T.Mesh(g,m);o.position.y=y;o.receiveShadow=true;P.add(o);return o;
}

/* mặt đứng dải kính + lam đứng (cho hông, sau, sân trong) */
function ribbonZ(z,x0,x1,dir,bands,spacing,pw){
  const len=x1-x0,n=Math.max(1,Math.round(len/spacing)),st=len/n;
  bands.forEach(b=>{
    const h=b[1]-b[0],yc=(b[0]+b[1])/2;
    box(len,h,.12,mGlass,(x0+x1)/2,yc,z+dir*.06);
    ce((x0+x1)/2,b[0]-.2,z+dir*.3,len,.4,.6);ce((x0+x1)/2,b[1]+.2,z+dir*.3,len,.4,.6);
    for(let i=0;i<=n;i++)ce(x0+i*st,yc,z+dir*.35,pw,h+.8,.7);
    for(let i=0;i<n;i++)we(x0+(i+.5)*st,yc,z+dir*.14,.07,h,.08);

}
function ribbonX(x,z0,z1,dir,bands,spacing,pw){

}

function stairs(cx,zTop,dir,half,N,rise,tread,cheekM){

  else{sh.moveTo(k*6.6,0);sh.lineTo(k*6.6,3.2);sh.lineTo(k*33.5,1.0);sh.lineTo(k*41.2,1.0);sh.lineTo(k*41.2,0);}

function bankMesh(s){

const WALL_TOP=3.55;
const wTop =[[8.5,16.7],[11,16.7],[14,16.7],[17,16.8],[20,17.0],[23,17.7],[26,18.8],[29.2,19.7]];   // mép trên tường đá (a=|x|, z)
const wBase=[[8.5,16.8],[11,16.8],[14,17.1],[17,17.6],[20,18.2],[23,19.0],[26,19.95],[29.2,21.1]];  // chân tường chạm mặt dốc
const wTail=[[29.2,19.7],[31.8,19.1],[34.6,17.7],[37.5,15.9],[41.2,14.6]];                          // tường nối quanh mép nền
const cTab =[[7.95,21.5],[10.9,21.5],[13.9,21.8],[17,22.45],[20,23.5],[23,25.1],[26.1,26.3]];       // thành trắng ngăn dốc và ao
function buildStairs(){
  /* thang hai đoạn: 8 bậc dưới, chiếu nghỉ lát đá sẫm, 6 bậc trên; rộng 14,3 m, má thang trắng */
  const half=7.15,ck=.8;
  const cheek=(h,zb,zf)=>{[-1,1].forEach(s=>bx(s>0?half:-half-ck,s>0?half+ck:-half,0,h+.8,zb,zf,mCurb));};
  for(let i=0;i<8;i++){const zf=30-i*.45,zb=zf-.45,h=(i+1)*.175;bx(-half,half,0,h,zb,zf,mStep);cheek(h,zb,zf);}
  bx(-half,half,0,1.4,24,26.4,mLand);cheek(1.4,24,26.4);
  for(let j=0;j<6;j++){const zf=24-j*(2.6/6),zb=zf-2.6/6,h=1.4+(j+1)*.3;bx(-half,half,0,h,zb,zf,mStep);cheek(h,zb,zf);}
}
function buildApproach(){
  const N=14;
  [-1,1].forEach(s=>{
    const O=[],OT=[],I=[],IT=[],IB=[];
    for(let i=0;i<=N;i++){
      const u=i/N,hr=.04+3.16*u,ao=29.2-20.7*u,ai=26.1-18.15*u;
      O.push([s*ao,hr,lerpT(wBase,ao)]);OT.push([s*ao,WALL_TOP,lerpT(wTop,ao)]);
      const zc=lerpT(cTab,ai);I.push([s*ai,hr,zc]);IT.push([s*ai,hr+.32,zc]);IB.push([s*ai,0,zc]);
    }
    const up=(L,dy,dz)=>L.map(p=>[p[0],p[1]+dy,p[2]+dz]);
    strip(O,I,mRamp,3);                                  // mặt dốc cong, thấp dần ra ngoài
    strip(O,OT,mTanD,6);                                 // tường đá vàng cát
    strip(up(OT,.12,0),up(OT,.12,-.55),mCurbD,2);        // gờ trắng trên tường
    strip(IB,IT,mCurbD,4);strip(IT,up(IT,0,.5),mCurbD,2);// thành trắng ngăn dốc và ao
    const TA=wTail.map(p=>[s*p[0],0,p[1]]),TB=wTail.map(p=>[s*p[0],WALL_TOP,p[1]]);
    strip(TA,TB,mTanD,6);strip(up(TB,.12,0),up(TB,.12,-.55),mCurbD,2);
    /* thảm cỏ trên nền, trước mặt tiền */
    const poly=[[s*8.5,14.6]].concat(wTop.map(p=>[s*p[0],p[1]]),wTail.slice(1).map(p=>[s*p[0],p[1]]));

/* ---------- 5. Sân trước: thảm cỏ oval, đường vòng, đài phun nước ---------- */
const FZ=100;                         // tâm thảm cỏ oval và đài phun nước
let waterIM=null;const waterData=[];
function buildGarden(){
  const prev=P;P=garden;
  try{
    const ell=(a,b,ha,hb)=>{const s=new T.Shape();s.absellipse(0,0,a,b,0,PI*2,false,0);const h=new T.Path();h.absellipse(0,0,ha,hb,0,PI*2,true,0);s.holes.push(h);return s;};
    const mesh=(g,m,x,y,z,cast)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=!!cast;o.receiveShadow=true;P.add(o);return o;};
    const ext=(shape,h)=>new T.ExtrudeGeometry(shape,{depth:h,bevelEnabled:false,curveSegments:96}).rotateX(-PI/2);

    /* sân nhựa đường trước bậc thềm (xe buýt đậu), nối với đường vòng */
    flat(88,43,mAsph,0,.03,36,8.8,4.3);

    /* thảm cỏ oval: bán trục 43 x 47 m (rộng khoảng 86 m, sâu khoảng 94 m), bó vỉa trắng mảnh */
    const lg=new T.CircleGeometry(1,96);lg.scale(43,47,1);scaleUV(lg,86/10,94/10);
    mesh(lg.rotateX(-PI/2),mLawn,0,.15,FZ);
    mesh(ext(ell(43.5,47.5,43,47),.2),mCurb,0,0,FZ,true);
    const rd=new T.ShapeGeometry(ell(50.5,54.5,43.5,47.5),96);scaleUV(rd,.1,.1);
    mesh(rd.rotateX(-PI/2),mAsph,0,.031,FZ);
    mesh(ext(ell(51,55,50.5,54.5),.18),mCurb,0,0,FZ,true);

    /* lối đá nhỏ chạy ngang thảm cỏ qua tâm đài phun nước */
    [-1,1].forEach(s=>flat(34.2,1.1,mPave,s*26,.16,FZ,34.2/2.4,1.1/2.4));

    /* ---- đài phun nước tròn ở tâm ---- */
    const wall=(r,h,m)=>{const g=new T.CylinderGeometry(r,r,h,72,1,true);scaleUV(g,2*PI*r/2.4,h/2.4);return mesh(g,m,0,h/2,FZ,true);};
    wall(7.6,.5,mGranD);wall(6.4,.45,mGranD);
    flat(0,0,mGran,0,.5,FZ,2*7.6/2.4,2*7.6/2.4,new T.RingGeometry(6.4,7.6,72));
    flat(0,0,mHedgeG,0,.19,FZ,0,0,new T.RingGeometry(7.6,8.35,72));         // dải cỏ viền thấp quanh bể
    flat(0,0,mCurb,0,.22,FZ,0,0,new T.RingGeometry(8.35,8.75,72));          // vành trắng ngoài cùng
    flat(0,0,mPondFloor,0,.05,FZ,0,0,new T.CircleGeometry(6.4,64));
    flat(0,0,mWater,0,.24,FZ,0,0,new T.CircleGeometry(6.4,64));
    /* bể nhỏ ở tâm có thành trắng nâng cao, chứa vòi phun chính */
    mesh(new T.CylinderGeometry(2.0,2.0,.9,40,1,true),mGranD,0,.45,FZ,true);
    flat(0,0,mCurb,0,.9,FZ,0,0,new T.RingGeometry(1.5,2.0,48));
    flat(0,0,mWater,0,.7,FZ,0,0,new T.CircleGeometry(1.5,40));
    mesh(new T.CylinderGeometry(.12,.2,.35,12),mGold,0,.78,FZ,false);
    for(let j=0;j<24;j++){const a=j/24*PI*2;mesh(new T.CylinderGeometry(.06,.1,.18,6),mGold,Math.cos(a)*1.8,.95,FZ+Math.sin(a)*1.8,false);}

    /* tia nước: một tia cao ở giữa và vòm tia mảnh hình chuông quanh tâm */
    for(let i=0;i<330;i++)waterData.push({ox:0,oy:1.0,oz:0,vx:(rnd()-.5)*.7,vy:14.4+rnd()*.6,vz:(rnd()-.5)*.7,T:2.55,ph:rnd()});
    for(let j=0;j<24;j++){const a=j/24*PI*2;for(let i=0;i<46;i++){const s=1.7+(rnd()-.5)*.35;waterData.push({ox:Math.cos(a)*1.8,oy:1.0,oz:Math.sin(a)*1.8,vx:Math.cos(a)*s+(rnd()-.5)*.25,vy:8.3+rnd()*.5,vz:Math.sin(a)*s+(rnd()-.5)*.25,T:1.4,ph:rnd()});}}
    waterIM=new T.InstancedMesh(new T.IcosahedronGeometry(.17,0),new T.MeshBasicMaterial({color:0xeaf7ff,transparent:true,opacity:.7,depthWrite:false}),waterData.length);
    waterIM.frustumCulled=false;waterIM.position.set(0,0,FZ);
    const _wm=new T.Matrix4();for(let i=0;i<waterData.length;i++)waterIM.setMatrixAt(i,_wm.identity());
    garden.add(waterIM);
  }finally{P=prev;}
}

function applyNight(n){
  mGlass.emissiveIntensity=n*.95;mGlassD.emissiveIntensity=n*.6;mLamp.emissiveIntensity=n*2.2;mWater.emissiveIntensity=n*.7;
  warm.forEach(l=>l.intensity=n*.45);

function lowEnv(){[mGlass,mGlassD,mFrame,mIron,mGold,mRail,mWater].forEach(m=>{m.metalness=Math.min(m.metalness,.15);});}
function tick(time){
  if(flagGeo){
    const p=flagGeo.attributes.position;
    for(let i=0;i<p.count;i++){const x=flagX[i];p.setZ(i,Math.sin(x*2.2-time*3.4+p.getY(i)*.4)*(x/3.6)*.4);}
    p.needsUpdate=true;flagGeo.computeVertexNormals();
  }
  if(waterIM&&garden.visible){
    const a=waterIM.instanceMatrix.array;
    for(let i=0;i<waterData.length;i++){
      const d=waterData[i],t=(((time/d.T)+d.ph)%1)*d.T;
      a[i*16+12]=d.ox+d.vx*t;a[i*16+13]=d.oy+d.vy*t-6*t*t;a[i*16+14]=d.oz+d.vz*t;
    }
    waterIM.instanceMatrix.needsUpdate=true;
  }
}
applyNight(0);
return {root,garden,slabB,slabG,tick,applyNight,lowEnv};

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('dinh-ar',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load the image-recognition library.'));document.head.appendChild(s);});}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const backOut=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};


/* ================= Chuẩn bị: thư viện + học hình bưu thiếp ================= */
let libs=null,targetUrl=null,prepP=null,model=null,sess=null;
function setPrep(txt,pct,bad){
  if(!$('load').hidden)$('loadP').textContent=txt;
}
async function getCompiler(){
  /* mindar-image.prod.js ở bản 1.2.5 là ES module, không nạp được bằng thẻ <script> thường */
  const M=await import(MINDAR_UMD);
  const C=M.Compiler||(M.default&&M.default.Compiler)||(M.MINDAR&&M.MINDAR.IMAGE&&M.MINDAR.IMAGE.Compiler)||(window.MINDAR&&window.MINDAR.IMAGE&&window.MINDAR.IMAGE.Compiler);
  if(!C)throw new Error('Image compiler not found in the library. Place a targets.mind file next to this HTML file.');
  return C;
}
async function prep(){
  setPrep('Loading AR library…',6);
  const [T,M]=await Promise.all([import('three'),import('mindar-image-three')]);
  libs={T,MindARThree:M.MindARThree};
  let buf=null;
  /* 1) ưu tiên file biên dịch sẵn targets.mind (nhanh, ổn định) */
  setPrep('Loading image-recognition data…',20);
  try{
    const r=await fetch(TARGET_FILE,{cache:'no-cache'});
    if(r.ok){const b=await r.arrayBuffer();if(b.byteLength>1000)buf=b;}
  }catch(e){console.warn('Không đọc được '+TARGET_FILE,e);}
  /* 2) dự phòng: biên dịch ngay trên máy (chậm ở lần đầu), có lưu cache */
  if(!buf){
    const img=$('targetImg');
    try{await img.decode();}catch(e){}
    const key=CACHE_KEY+':'+img.src.length;
    try{buf=await idbGet(key);}catch(e){}
    if(!buf){
      setPrep('Learning the painting (first time only, may take a few seconds)…',30);
      const Compiler=await getCompiler();
      const comp=new Compiler();
      await comp.compileImageTargets([img],p=>setPrep('Learning the painting… '+Math.round(p)+'%',30+Math.round(p)*.67));
      buf=await comp.exportData();
      try{await idbSet(key,buf);}catch(e){}
    }
  }
  targetUrl=URL.createObjectURL(new Blob([buf]));
  setPrep('Ready.',100);
}
function ensurePrep(){
  if(!prepP)prepP=prep().catch(e=>{prepP=null;console.error(e);setPrep('Could not prepare AR: '+((e&&e.message)||e),0,true);throw e;});
  return prepP;
}

function makeEnv(T,renderer,scene){
  const es=new T.Scene();
  es.add(new T.Mesh(new T.SphereGeometry(50,32,16),new T.ShaderMaterial({
    side:T.BackSide,
    vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:'varying vec3 vP;void main(){float h=normalize(vP).y;vec3 top=vec3(.50,.68,.96);vec3 hor=vec3(.95,.95,.92);vec3 gr=vec3(.46,.48,.44);vec3 c=h>0.?mix(hor,top,pow(h,.6)):mix(hor,gr,pow(-h,.5));gl_FragColor=vec4(c,1.);}'
  })));
  const pm=new T.PMREMGenerator(renderer);
  const rt=pm.fromScene(es,0,1,100);
  scene.environment=rt.texture;pm.dispose();
}

let gardenOn=false,nightGoal=0,autoSpin=false,userScale=1,found=false;
function show(w){}
function setPress(btn,on){btn.setAttribute('aria-pressed',String(!!on));}
function setFound(f){
  found=f;
  $('frame').hidden=f;$('frameCap').hidden=f;
  const k=$('kick');k.dataset.s=f?'ok':'';k.textContent=f?'Recognized':'Searching';
  $('sh').textContent=f?'Independence Palace, main building':'Point the camera at the painting';
}
function niceError(e){
  const n=(e&&e.name)||'',m=(e&&e.message)||String(e||'');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return 'The browser cannot access the camera. Open this page over https:// or localhost.';
  if(n==='NotAllowedError'||/permission|denied/i.test(m))return 'Camera permission was denied. Allow camera access for this page and try again.';
  if(n==='NotFoundError'||/requested device|not found/i.test(m))return 'No camera was found on this device.';
  if(/Failed to fetch|dynamically imported|NetworkError|Load failed/i.test(m))return 'Could not load the AR library ('+m+'). Check your connection and try again.';
  return 'Something went wrong while starting AR'+(m?': '+m:'.');
}

/* ================= Phiên AR ================= */
const ZC_BLD=-11.5, ZC_ALL=51.5;                 // tâm khối theo trục z (m): chỉ tòa nhà / cả sân trước
const asp=()=>{const i=$('targetImg');return (i.naturalHeight/i.naturalWidth)||.733;};
const scBld=()=>.92*Math.min(1/112,asp()/91);    // bề ngang bưu thiếp = 1 đơn vị
const scAll=()=>.92*Math.min(1/112,asp()/217);

async function openSession(){
  const {T,MindARThree}=libs;
  const host=$('ar');host.innerHTML='';
  const mind=new MindARThree({container:host,imageTargetSrc:targetUrl,maxTrack:1,uiLoading:'no',uiScanning:'no',uiError:'no',warmupTolerance:4,missTolerance:12});
  const {renderer,scene,camera}=mind;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
  if('useLegacyLights' in renderer)renderer.useLegacyLights=true;   // giữ độ sáng như bản web gốc

  let envOK=false;
  try{
    const gl=renderer.getContext();
    envOK=!!(gl.getExtension('EXT_color_buffer_float')||gl.getExtension('EXT_color_buffer_half_float'));
    if(envOK)makeEnv(T,renderer,scene);
  }catch(e){envOK=false;console.warn(e);}
  if(!model)model=createModel(T,renderer.capabilities.getMaxAnisotropy());
  if(!envOK)model.lowEnv();

  /* đèn gắn với tấm tranh; hệ trục neo: x sang phải, y lên trên mép tranh, z hướng ra khỏi tranh */
  const rig=new T.Group();
  const amb=new T.AmbientLight(0xeef3ff,.6);
  const sun=new T.DirectionalLight(0xfff1dc,1.3);sun.position.set(.55,-.6,1);
  const fill=new T.DirectionalLight(0xdfeaff,.35);fill.position.set(-.6,.5,.45);
  rig.add(amb,sun,sun.target,fill,fill.target);

  /* stage: dựng mô hình (y lên) thành nằm trên mặt tranh (z lên), mặt tiền hướng về mép dưới tranh */
  const stage=new T.Group(),spin=new T.Group(),center=new T.Group();
  stage.rotation.x=Math.PI/2;
  stage.add(spin);spin.add(center);
  center.add(model.root,model.garden,model.slabB,model.slabG);
  rig.add(stage);
  model.garden.visible=gardenOn;model.slabG.visible=gardenOn;

  const anchor=mind.addAnchor(0);
  anchor.group.add(rig);
  anchor.onTargetFound=()=>{if(!sess)return;sess.appear=0;setFound(true);};
  anchor.onTargetLost=()=>{if(!sess)return;setFound(false);};

  const s={mind,renderer,scene,camera,rig,stage,spin,center,amb,sun,fill,T,
    sc:(gardenOn?scAll():scBld())*userScale,zc:gardenOn?ZC_ALL:ZC_BLD,appear:1,time:0,night:0,nightApplied:-1,
    cAmbD:new T.Color(0xeef3ff),cAmbN:new T.Color(0x6f80b8),cSunD:new T.Color(0xfff1dc),cSunN:new T.Color(0x8fa6e0)};
  sess=s;
  spin.rotation.y=0;

  await mind.start();
  if(sess!==s)return s;                // người dùng đã đóng khi đang khởi động
  let last=performance.now();
  renderer.setAnimationLoop(()=>{
    const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;s.time+=dt;
    const k=1-Math.exp(-dt*6);
    s.sc+=((gardenOn?scAll():scBld())*userScale-s.sc)*k;
    s.zc+=((gardenOn?ZC_ALL:ZC_BLD)-s.zc)*k;
    s.appear=Math.min(1,s.appear+dt*2.2);
    const sc=s.sc*backOut(s.appear);
    stage.scale.setScalar(Math.max(sc,1e-5));
    stage.position.set(0,0,THICK*sc);
    center.position.set(0,0,-s.zc);
    if(autoSpin)spin.rotation.y+=dt*.45;
    if(Math.abs(s.night-nightGoal)>.001||s.nightApplied!==s.night){
      s.night+=(nightGoal-s.night)*Math.min(1,dt*3);
      if(Math.abs(s.night-nightGoal)<=.001)s.night=nightGoal;
      applyNight(s);
    }
    model.tick(s.time);
    renderer.render(scene,camera);
  });
  return s;
}
function applyNight(s){
  const n=s.night,L=(a,b)=>a+(b-a)*n;
  s.amb.intensity=L(.6,.32);s.amb.color.copy(s.cAmbD).lerp(s.cAmbN,n);
  s.sun.intensity=L(1.3,.4);s.sun.color.copy(s.cSunD).lerp(s.cSunN,n);
  s.fill.intensity=L(.35,.12);
  s.renderer.toneMappingExposure=L(1.05,.95);
  model.applyNight(n);
  $('ar').style.setProperty('--night',n.toFixed(3));
  s.nightApplied=n;
}

function showLoad(t,p){$('loadT').textContent=t;$('loadP').textContent=p||'Please wait a moment.';$('load').hidden=false;$('fail').hidden=true;}
async function startAR(){
  showLoad('Getting ready','Loading library and target image…');

    await ensurePrep();
    showLoad('Starting camera','Allow camera access if asked.');

  }
}
async function teardown(){
  const s=sess;sess=null;
  if(s){
    try{s.renderer.setAnimationLoop(null);}catch(e){}

  }
  $('ar').innerHTML='';
}

/* kéo để xoay, chụm hai ngón để thu phóng, lăn chuột để thu phóng */
const ar=$('ar'),ptr=new Map();let pd0=0,us0=1;
const pdist=()=>{const a=[...ptr.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);};
ar.addEventListener('pointerdown',e=>{try{ar.setPointerCapture(e.pointerId);}catch(_){}ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===2){pd0=pdist();us0=userScale;}});
ar.addEventListener('pointermove',e=>{
  const p=ptr.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x;p.x=e.clientX;p.y=e.clientY;
  if(ptr.size===1&&sess)sess.spin.rotation.y+=dx*.01;
  else if(ptr.size===2&&pd0>0){userScale=clamp(us0*pdist()/pd0,.5,2.5);}
});
